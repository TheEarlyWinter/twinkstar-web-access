name: Build & Release App

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Package App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run test suite
        run: npm test

      - name: Get version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="v$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "ZIP_NAME=app-twinkstar-web-access-$VERSION.zip" >> $GITHUB_OUTPUT

      - name: Build V2 Package & Archive
        run: |
          mkdir -p ../packages
          node scripts/build-v2-package.mjs --out ../packages
          mkdir -p dist
          cd ../packages/twinkstar-web-access
          zip -r "$GITHUB_WORKSPACE/dist/${{ steps.get_version.outputs.ZIP_NAME }}" .
          cd "$GITHUB_WORKSPACE"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.get_version.outputs.ZIP_NAME }}
          path: dist/${{ steps.get_version.outputs.ZIP_NAME }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.get_version.outputs.ZIP_NAME }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
